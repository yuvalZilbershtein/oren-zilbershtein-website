- quote: >-
    Collaborating with Chef Oren has been a transformative experience for my
    businesses in Prague. At Turquoise, he built our pastry department and
    high-end catering division from the ground up, training our kitchen and
    pastry teams to perfection and leading complex, high-profile diplomatic
    events for the Israeli Embassy. In addition to Turquoise, Oren expanded his
    culinary impact to my separate venture, Chlebíčky, where he developed an
    innovative line of artisanal sweet and savory Czech koláče using local
    ingredients and global techniques. Beyond his extraordinary culinary vision
    and precision, our work together became a true friendship and an invaluable
    partnership that elevated everything we do.
  name: Igal Krisp
  role: Owner
  business: Turquoise & Chlebíčky
  location: Prague, Czech Republic
  place: turquoise

