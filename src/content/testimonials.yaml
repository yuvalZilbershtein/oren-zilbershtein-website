- quote: >-
    Producing ultra-luxury Passover programs for 500 to 1,000 discerning guests
    in world-class 5-star resorts requires flawless operational mastery and
    culinary perfection—and Chef Oren delivers on every single front. From the
    grand Kempinski in Cancun, Mexico, and ahead of our upcoming flagship
    production in Cartagena, Colombia alongside Chef Meir Adoni, Oren has been
    the culinary cornerstone of our pastry division.

    He masterfully leads large brigades of up to 15 pastry chefs—seamlessly
    uniting his handpicked core team with local resort personnel. Under intense
    holiday schedules, Oren orchestrates lavish daily dessert buffets,
    breathtaking plated fine-dining creations for holiday and Shabbat gala
    dinners, and synchronizes effortlessly with the executive kitchen under the
    strictest kosher standards. His calm command under pressure, leadership, and
    elite artistry elevate our brand to the highest international luxury
    standard.
  name: Malka Perlman
  role: Founder & Owner
  business: Kosher by Malka
  place: kempinski-cancun

- quote: >-
    Collaborating with Chef Oren for a comprehensive culinary overhaul at Nof
    Ginosar Hotel was an extraordinary experience. Throughout an intensive
    month—working tirelessly from morning to night across the peak High
    Holidays of Rosh Hashanah and Sukkot—Oren completely restructured our entire
    pastry department, introducing modern production techniques and
    standardizing new recipe portfolios. He mentored our pastry team with
    dedicated, hands-on training, working seamlessly alongside our Executive
    Chef and the F&B leadership. Oren designed scalable, premium menus tailored
    for high-occupancy family dining, diverse buffets, conferences, and intimate
    banquet setups—from elevated everyday cakes to signature artisanal
    cookies—all while maintaining the highest kosher standards. His deep
    understanding of hotel pastry operations and unwavering commitment made a
    lasting impact on our hospitality standard.
  name: Etty
  role: Food & Beverage Director
  business: Nof Ginosar Hotel
  location: Sea of Galilee, Israel
  place: nof-ginosar-hotel

- quote: >-
    Bringing Chef Oren to Emilia Gelato in Panama City was an absolute game
    changer for our brand. He expanded our concept far beyond traditional
    gelato, creating an irresistible line of oversized, soft-baked artisanal
    cookies in signature flavors, alongside a premium crêpe menu featuring
    custom sauces, decadent toppings, and gelato pairings. Oren also developed
    vibrant new gelato flavors that honor authentic Italian craftsmanship while
    appealing beautifully to both our local Panamanian clientele and the Jewish
    kosher community. From engineering an outdoor catering setup for private
    events to thoroughly training our team and leaving behind comprehensive,
    standardized recipe books, Oren operated with exceptional precision and
    passion. He elevated our entire operation to international standards.
  name: Meir Swisa
  role: Owner
  business: Emilia Gelato
  location: Panama City, Panama
  place: emilia-gelato
