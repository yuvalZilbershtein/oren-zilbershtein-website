- quote: >-
    Producing ultra-luxury Passover programs for 500 to 1,000 discerning guests
    in world-class 5-star resorts requires flawless operational mastery and
    culinary perfection—and Chef Oren delivers on every single front. From City
    of Dreams in Limassol, Cyprus to the Kempinski in Cancun, Mexico, and ahead
    of our upcoming flagship production in Cartagena, Colombia alongside Chef
    Meir Adoni, Oren has been the culinary cornerstone of our pastry division.
    He masterfully leads large brigades of up to 15 pastry chefs—seamlessly
    uniting his handpicked core team with local resort personnel. Under intense
    holiday schedules, Oren orchestrates lavish daily dessert buffets,
    breathtaking plated fine-dining creations for holiday and Shabbat gala
    dinners, and synchronizes effortlessly with the executive kitchen under the
    strictest kosher standards. His calm command under pressure, leadership, and
    elite artistry elevate our brand to the highest international luxury
    standard.
  name: Malka Perlman
  role: Founder & Owner
  business: Kosher by Malka
  place: city-of-dreams
